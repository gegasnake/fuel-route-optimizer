name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validation:
    name: Validate project
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"

      POSTGRES_DB: app_test_db
      POSTGRES_USER: app_test_user
      POSTGRES_PASSWORD: app_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: app_test_db
          POSTGRES_USER: app_test_user
          POSTGRES_PASSWORD: app_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U app_test_user -d app_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchronize dependencies
        run: uv sync --locked

      - name: Run tox validation suite
        run: uv run tox